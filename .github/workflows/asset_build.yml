name: Build Native Assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing opencc-v tag to update; leave empty for latest
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'opencc-v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: windows-arm64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-x64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-14
          - name: ios-iphoneos-arm64
            os: macos-14
          - name: ios-iphonesimulator-arm64
            os: macos-14
          - name: ios-iphonesimulator-x64
            os: macos-14
          - name: android-arm64
            os: ubuntu-latest
          - name: android-arm
            os: ubuntu-latest
          - name: android-x64
            os: ubuntu-latest
          - name: android-x86
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Checkout OpenCC
        uses: actions/checkout@v5
        with:
          repository: BYVoid/OpenCC
          ref: ver.1.4.1
          path: third_party/opencc

      - name: Set up Flutter
        if: matrix.name != 'linux-arm64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Flutter (Linux arm64)
        if: matrix.name == 'linux-arm64'
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version

      - name: Install CMake
        if: runner.os == 'macOS'
        run: brew install cmake

      - run: flutter pub get

      - name: Build and package OpenCC
        run: >-
          dart tool/build_opencc.dart
          --target ${{ matrix.name }}
          --source third_party/opencc
          --build build/opencc/${{ matrix.name }}
          --install build/opencc/${{ matrix.name }}/install
          --package build/opencc/${{ matrix.name }}/opencc-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v5
        with:
          name: opencc-${{ matrix.name }}
          path: |
            build/opencc/${{ matrix.name }}/opencc-${{ matrix.name }}.zip
            build/opencc/${{ matrix.name }}/opencc-${{ matrix.name }}.zip.sha256
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/opencc-v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cd release
          for file in *.zip; do
            sha256sum -c "$file.sha256"
          done

      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.release_tag }}"
            if [[ -z "$tag" ]]; then
              tag="$(gh release list --repo "$GITHUB_REPOSITORY" --json tagName --jq '[.[] | select(.tagName | startswith("opencc-v"))][0].tagName')"
            fi
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ -z "$tag" ]]; then
            echo "No opencc-v release found." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload assets to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.zip* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/*.zip* --title "$TAG" --repo "$GITHUB_REPOSITORY"
          fi
