name: flutter_opencc_plus
description: A cross-platform OpenCC wrapper for Dart and Flutter.
version: 0.1.1

repository: https://github.com/openAnimeFlow/flutter_opencc_plus
homepage: https://github.com/openAnimeFlow/flutter_opencc_plus

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.1.0
  code_assets: ^2.0.0
  crypto: ^3.0.7
  ffi: ^2.2.0
  hooks: ^2.2.0
  path: ^1.9.0

dev_dependencies:
  ffigen: ^20.1.1
  lints: ^6.0.0
  test: ^1.25.15

flutter:
  assets:
    - assets/opencc/
