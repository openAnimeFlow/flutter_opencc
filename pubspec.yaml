name: flutter_opencc
description: A cross-platform OpenCC wrapper for Dart and Flutter.
version: 0.1.0-dev.1
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  archive: ^4.1.0
  code_assets: ^2.0.0
  crypto: ^3.0.7
  ffi: ^2.2.0
  hooks: ^2.2.0
  path: ^1.9.0

dev_dependencies:
  ffigen: ^20.1.1
  lints: ^6.0.0
  test: ^1.25.15

flutter:
  assets:
    - assets/opencc/
